# SPDX-License-Identifier: EUPL-1.2
name: ci
on:
  push:
    branches: [main]
  pull_request:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: false
      - run: make check

  # The only required status check of the repository ruleset. It always runs and
  # fails unless every job it needs succeeded.
  check:
    name: check
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every needed job to have succeeded
        env:
          NEEDS_RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          for r in $NEEDS_RESULTS; do
            test "$r" = success || { echo "needed job result: $r"; exit 1; }
          done
